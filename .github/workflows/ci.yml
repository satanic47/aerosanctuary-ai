name: CI Quality & Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx fastapi uvicorn pydantic pydantic-settings google-generativeai

      - name: Static Code Analysis (Ruff Linter)
        run: python -m ruff check backend tests

      - name: Code Formatting Check (Ruff Formatter)
        run: python -m ruff format --check backend tests

      - name: Execute Full Unit Test Suite
        run: python -m pytest --maxfail=1 --disable-warnings -v
